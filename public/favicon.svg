<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Pink to Cyan gradient -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <!-- Purple to Marine gradient -->
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c50c5"/>
      <stop offset="100%" stop-color="#4ac9dd"/>
    </linearGradient>
    <!-- Lime to Orange gradient -->
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d6345a"/>
      <stop offset="100%" stop-color="#8e6ddb"/>
    </linearGradient>
  </defs>

  <!-- Window background -->
  <rect width="32" height="32" rx="4" fill="#18181c"/>

  <!-- Header bar -->
  <rect width="32" height="5" rx="4" fill="#242526"/>
  <rect y="3" width="32" height="3" fill="#242526"/>

  <!-- Traffic lights -->
  <circle cx="4" cy="3" r="1.3" fill="#ff5f57"/>
  <circle cx="8" cy="3" r="1.3" fill="#febc2e"/>
  <circle cx="12" cy="3" r="1.3" fill="#28c840"/>

  <!-- Footer bar (mirrors header: 7px tall with rx=4 on bottom) -->
  <!-- <rect y="27" width="32" height="5" rx="4" fill="#242526"/>
  <rect y="27" width="32" height="3" fill="#242526"/> -->

  <!-- Content lines with gradients -->
  <rect x="4" y="11" width="20" height="3" rx="1" fill="url(#grad1)"/>
  <rect x="4" y="17" width="15" height="3" rx="1" fill="url(#grad2)"/>
  <rect x="4" y="23" width="24" height="3" rx="1" fill="url(#grad3)"/>
</svg>
